<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if title %}{{ title }} · Diaspora Resource Hub{% else %}Diaspora Resource Hub{% endif %}</title>
    <script>
        // Applied before first paint to avoid a flash of the wrong theme.
        (function () {
            if (localStorage.getItem("theme") === "dark") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
    <script src="{{ url_for('static', filename='js/xlsx-writer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/export.js') }}"></script>
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>

<header class="top-bar">
    <a href="{{ url_for('dashboard') }}" class="brand">
        <img src="{{ url_for('static', filename='diaspora_logo.png') }}" alt="Logo" class="brand-logo">
        <span class="brand-divider"></span>
        <span>
            <span class="brand-name">Diaspora Resource Hub</span>
            <span class="brand-tagline">Inventory &amp; Operations</span>
        </span>
    </a>
</header>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div id="flashData" style="display:none;">
        {% for category, message in messages %}
        <div data-category="{{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
{% endwith %}

<main class="content">
    {% block content %}{% endblock %}
</main>

</body>
</html>
